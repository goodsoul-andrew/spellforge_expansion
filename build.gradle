plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'goodsoul_andrew.spellforgeexpansion'
version = mod_version
base {
    archivesName = 'spellforge-expansion'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                spellforge_expansion {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                spellforge_expansion {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository) // Раскомментируйте при использовании ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "maven.modrinth:s4OWxYQQ:hZaEegS9"// irons_spellbooks-1.20.1-3.16.3
    //implementation fg.deobf("maven.modrinth:irons-spells-n-spellbooks:${irons_spells_version}")
}

mixin {
    add sourceSets.main, 'spellforge_expansion.refmap.json'
    config 'spellforge_expansion.mixins.json'
}

jar {
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'spellforge_expansion.mixins.json'
        ])
    }
}
